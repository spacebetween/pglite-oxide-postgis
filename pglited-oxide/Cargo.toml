[package]
name = "pglited-oxide"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "pglited-oxide"
path = "src/main.rs"

[dependencies]
pglite-oxide = "0.5.0"
anyhow = "1"
serde_json = "1"
ctrlc = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net"] }
tokio-postgres = "0.7"

[patch.crates-io]
pglite-oxide = { path = "../vendor/pglite-oxide" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
